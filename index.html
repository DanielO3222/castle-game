<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hold the Keep">
<title>Hold the Keep</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv"></canvas>

<div id="top">
  <div id="res">
    <div class="r" id="r-wood" title="Wood"><i>🪵</i><b>0</b></div>
    <div class="r" id="r-stone" title="Stone"><i>🪨</i><b>0</b></div>
    <div class="r" id="r-iron" title="Iron"><i>🔩</i><b>0</b></div>
    <div class="r" id="r-food" title="Food"><i>🍎</i><b>0</b></div>
    <div class="r" id="r-gold" title="Gold"><i>🪙</i><b>0</b></div>
    <div class="r" id="r-pop" title="People / housing, and idle peasants"><i>👥</i><b>0</b><sup>0</sup></div>
  </div>
  <div id="bar2">
    <div id="wave"><span id="wave-n">Wave 1</span> <span id="wave-t">in 3:00</span></div>
    <button id="btn-send" class="sm red">⚔ Send</button>
    <button id="btn-speed" class="sm">1×</button>
    <button id="btn-pause" class="sm">⏸</button>
    <button id="btn-menu" class="sm">☰</button>
  </div>
  <div id="wave-p"></div>
</div>
<canvas id="mini" width="200" height="200"></canvas>
<div id="tut" class="hidden"><span id="tut-t"></span><button id="tut-x">✕</button></div>
<div id="toasts"></div>
<div id="draglabel" class="hidden"></div>
<button id="btn-army" class="fab">⚔ Army <span id="army-n">0</span></button>
<button id="btn-undo" class="fab hidden">↶ Undo</button>

<div id="bottom">
  <div id="hint" class="hidden"><span id="hint-t"></span><button id="hint-ok" class="green hidden">✓</button><button id="hint-x" class="red">✕ Cancel</button></div>
  <div id="sheet" class="hidden"></div>
  <div id="build">
    <div id="tabs">
      <button data-tab="eco" class="on">Economy</button>
      <button data-tab="castle">Castle</button>
      <button data-tab="mil">Military</button>
    </div>
    <div id="items"></div>
  </div>
</div>

<div id="overlay" class="hidden"><div class="card" id="ov-card"></div></div>
<script src="game.js"></script>
<script src="editor.js"></script>
</body>
</html>
